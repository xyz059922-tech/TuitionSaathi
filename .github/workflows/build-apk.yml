name: Build Tuition Saathi APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'TuitionSaathi_Android_Project.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack Android project
        run: unzip -q TuitionSaathi_Android_Project.zip -d buildsrc
      - name: Build debug APK
        working-directory: buildsrc/TuitionSaathiAndroid
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tuition-Saathi-APK
          path: buildsrc/TuitionSaathiAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
